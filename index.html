  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:rgba(235,250,253,.28);
    z-index:-1;
  }
  button,input,textarea{font:inherit}
  button{cursor:pointer;border:0}
  .wrap{width:min(920px,92%);margin:0 auto;padding:48px 0 70px}
  header{text-align:center;margin-bottom:28px}
  h1{
    margin:0;
    font-family:"Yomogi","M PLUS Rounded 1c",cursive;
    font-size:43px;font-weight:400;letter-spacing:.08em;
    color:#5b9fb2;
    text-shadow:0 2px 0 rgba(255,255,255,.9);
  }
  .card{
    background:rgba(255,255,255,.84);
    border:2px solid rgba(255,255,255,.9);
    box-shadow:0 12px 32px rgba(79,145,163,.14);
    backdrop-filter:blur(5px);
    border-radius:30px;
    padding:26px;
    margin-bottom:18px;
  }
  .search{display:flex;gap:10px}
  input,textarea{
    width:100%;border:2px solid var(--line);
    background:rgba(255,255,255,.9);
    border-radius:20px;padding:13px 15px;color:var(--text);outline:none;
  }
  input:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(131,207,225,.16)}
  textarea{min-height:150px;resize:vertical}
  .btn{
    background:linear-gradient(180deg,#9cdeea,#7cc9dc);
    color:white;border-radius:999px;padding:12px 21px;
    box-shadow:0 5px 0 #62b3c8;
    transition:transform .12s,box-shadow .12s,filter .12s;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.03)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #62b3c8}
  .btn.secondary{
    background:rgba(255,255,255,.75);color:var(--deep);
    box-shadow:none;border:2px solid var(--line)
  }
  .btn.danger{background:linear-gradient(180deg,#f0adb7,#e494a1);box-shadow:0 5px 0 #d37f8d}
  .center{text-align:center}
  .big{font-size:18px;padding:14px 28px}
  .stats{display:grid;grid-template-columns:1fr 2fr;gap:18px}
  .stat{text-align:center;padding:18px;background:rgba(247,253,255,.8)}
  .num{font-size:32px;color:var(--deep);font-weight:600}
  .recent h2,.section-title{margin:0 0 14px;color:var(--deep);font-size:20px}
  .list{display:grid;gap:9px}
  .word-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 15px;border-radius:18px;
    background:rgba(250,254,255,.88);border:1px solid var(--line);
    cursor:pointer;transition:.12s;
  }
  .word-row:hover{background:#eefafd;transform:translateY(-1px)}
  .empty{text-align:center;color:#8aa3aa;padding:16px}
  .page{display:none}.page.active{display:block}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .topbar h2{margin:0;color:var(--deep)}
  label{display:block;margin:14px 0 7px;font-size:14px;color:#63818a}
  .detail-title{font-family:"Yomogi","M PLUS Rounded 1c",cursive;font-size:34px;font-weight:400;color:var(--deep);margin:0 0 16px}
  .explain{white-space:pre-wrap;background:rgba(247,252,253,.86);border:1px solid var(--line);border-radius:20px;padding:16px;line-height:1.8}
  .mistakes{font-size:18px;text-align:center;margin:20px 0}
  .mistakes strong{font-size:32px;color:var(--deep)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .notice{font-size:13px;color:#78949c;text-align:center;margin-top:14px}

  /* 軽いCSSだけで動く、ふわっとしたキラキラ */
  .sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .sparkles i{
    position:absolute;width:8px;height:8px;
    background:rgba(255,255,255,.88);
    transform:rotate(45deg);
    border-radius:2px;
    animation:twinkle 3.8s ease-in-out infinite;
  }
  .sparkles i:nth-child(1){left:8%;top:18%;animation-delay:-.7s}
  .sparkles i:nth-child(2){left:89%;top:27%;width:6px;height:6px;animation-delay:-2.1s}
  .sparkles i:nth-child(3){left:16%;top:72%;width:6px;height:6px;animation-delay:-1.5s}
  .sparkles i:nth-child(4){left:82%;top:68%;animation-delay:-3s}
  .sparkles i:nth-child(5){left:53%;top:10%;width:5px;height:5px;animation-delay:-2.6s}
  @keyframes twinkle{
    0%,100%{opacity:.18;transform:rotate(45deg) scale(.65)}
    50%{opacity:.9;transform:rotate(45deg) scale(1.2)}
  }
  .wrap{position:relative;z-index:1}
  @media(max-width:650px){
    .wrap{padding-top:30px}.card{padding:20px}.stats{grid-template-columns:1fr}
    .search{flex-direction:column}.search .btn{width:100%}
    h1{font-size:37px}
  }
  button,input,textarea{font:inherit}
  button{cursor:pointer;border:0}
  .wrap{width:min(920px,92%);margin:0 auto;padding:42px 0 60px}
  header{text-align:center;margin-bottom:28px}
  .cat{font-size:34px}
  h1{margin:4px 0 6px;font-size:34px;color:var(--deep);letter-spacing:.08em}
  .sub{margin:0;color:#72919a;font-size:14px}
  .card{
    background:rgba(255,253,253,.92); border:2px solid rgba(255,255,255,.9);
    box-shadow:0 10px 28px rgba(77,153,170,.13); border-radius:28px; padding:26px;
    margin-bottom:18px;
  }
  .search{display:flex;gap:10px}
  input,textarea{
    width:100%; border:2px solid var(--line); background:#fff;
    border-radius:18px; padding:13px 15px; color:var(--text); outline:none;
  }
  input:focus,textarea:focus{border-color:var(--blue)}
  textarea{min-height:150px;resize:vertical}
  .btn{
    background:var(--blue);color:white;border-radius:18px;padding:12px 20px;
    box-shadow:0 5px 0 #5aaabd;transition:.12s;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5aaabd}
  .btn.secondary{background:#eefbfd;color:var(--deep);box-shadow:none;border:2px solid var(--line)}
  .btn.danger{background:var(--danger);box-shadow:0 5px 0 #ce7985}
  .center{text-align:center}
  .big{font-size:20px;padding:15px 28px;border-radius:22px}
  .stats{display:grid;grid-template-columns:1fr 2fr;gap:18px}
  .stat{text-align:center;padding:18px;background:#f2fbfd;border-radius:22px}
  .num{font-size:32px;color:var(--deep);font-weight:500}
  .recent h2,.section-title{margin:0 0 14px;color:var(--deep);font-size:20px}
  .list{display:grid;gap:9px}
  .word-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;border-radius:16px;background:#f7fcfd;border:1px solid var(--line);
    cursor:pointer;
  }
  .word-row:hover{background:#eefafd}
  .empty{text-align:center;color:#8aa3aa;padding:16px}
  .page{display:none}
  .page.active{display:block}
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .topbar h2{margin:0;color:var(--deep)}
  label{display:block;margin:14px 0 7px;font-size:14px;color:#63818a}
  .detail-title{font-size:30px;color:var(--deep);margin:0 0 16px}
  .explain{white-space:pre-wrap;background:#f7fcfd;border:1px solid var(--line);border-radius:18px;padding:16px;line-height:1.8}
  .mistakes{font-size:18px;text-align:center;margin:20px 0}
  .mistakes strong{font-size:32px;color:var(--deep)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .notice{font-size:13px;color:#78949c;text-align:center;margin-top:14px}
  @media(max-width:650px){
    .wrap{padding-top:25px}.card{padding:20px}.stats{grid-template-columns:1fr}
    .search{flex-direction:column}.search .btn{width:100%}h1{font-size:29px}
  }
</style>
</head>
<body>
<div class="sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
<div class="wrap">
  <header>
    <h1>単語まとめ</h1>
  </header>

  <main id="home" class="page active">
    <section class="card">
      <div class="search">
        <input id="searchInput" placeholder="🔍 単語を検索..." autocomplete="off">
        <button class="btn" onclick="searchWord()">検索</button>
      </div>
      <div id="searchResults" class="list" style="margin-top:12px"></div>
      <div class="center" style="margin-top:20px">
        <button class="btn big" onclick="showPage('add')">＋ 単語を追加する 🐾</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat card">
        <div>📚 登録単語数</div>
        <div id="wordCount" class="num">0</div>
        <div>個</div>
      </div>
      <div class="card recent">
        <h2>🆕 最近追加した単語</h2>
        <div id="recentList" class="list"></div>
      </div>
    </section>
  </main>

  <main id="add" class="page">
    <section class="card">
      <div class="topbar"><button class="btn secondary" onclick="showPage('home')">← 戻る</button><h2>単語を追加</h2></div>
      <label for="wordInput">単語</label>
      <input id="wordInput" placeholder="例：VLAN">
      <label for="meaningInput">自分の意味・解説</label>
      <textarea id="meaningInput" placeholder="自分の言葉で書いてみよう！"></textarea>
      <div class="center" style="margin-top:18px"><button class="btn big" onclick="addWord()">🐈 登録する</button></div>
    </section>
  </main>

  <main id="detail" class="page">
    <section class="card">
      <div class="topbar"><button class="btn secondary" onclick="showPage('home')">← ホーム</button><h2>単語の詳細</h2></div>
      <h2 id="detailWord" class="detail-title"></h2>
      <div id="detailMeaning" class="explain"></div>
      <div class="mistakes">間違えた回数：<strong id="detailMistakes">0</strong>回</div>
      <div class="actions">
        <button class="btn big" onclick="mistake()">❌ 間違えた！</button>
        <button class="btn secondary" onclick="editWord()">✏️ 編集</button>
        <button class="btn danger" onclick="deleteWord()">🗑️ 削除</button>
      </div>
    </section>
  </main>

  <main id="edit" class="page">
    <section class="card">
      <div class="topbar"><button class="btn secondary" onclick="showDetail(currentId)">← 戻る</button><h2>単語を編集</h2></div>
      <label for="editWordInput">単語</label>
      <input id="editWordInput">
      <label for="editMeaningInput">自分の意味・解説</label>
      <textarea id="editMeaningInput"></textarea>
      <div class="center" style="margin-top:18px"><button class="btn big" onclick="saveEdit()">💾 保存する</button></div>
    </section>
  </main>
</div>

<script>
const KEY = "itpassport_words_v1";
let words = JSON.parse(localStorage.getItem(KEY) || "[]");
let currentId = null;

function save(){ localStorage.setItem(KEY, JSON.stringify(words)); }

function showPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="home") renderHome();
}

function renderHome(){
  document.getElementById("wordCount").textContent = words.length;
  const recent = [...words].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  const box = document.getElementById("recentList");
  box.innerHTML = recent.length ? recent.map(w=>row(w)).join("") : '<div class="empty">まだ単語がありません🐾</div>';
}

function row(w){
  return `<div class="word-row" onclick="showDetail('${w.id}')"><span>📘 ${escapeHtml(w.word)}</span><span>→</span></div>`;
}

function addWord(){
  const word = document.getElementById("wordInput").value.trim();
  const meaning = document.getElementById("meaningInput").value.trim();
  if(!word || !meaning){ alert("単語と意味・解説を入力してね！"); return; }
  words.push({id: Date.now().toString(),word,meaning,mistakes:0,createdAt:Date.now()});
  save();
  document.getElementById("wordInput").value="";
  document.getElementById("meaningInput").value="";
  showPage("home");
}

function searchWord(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const box = document.getElementById("searchResults");
  if(!q){box.innerHTML="";return;}
  const found = words.filter(w=>w.word.toLowerCase().includes(q));
  box.innerHTML = found.length ? found.map(w=>row(w)).join("") : '<div class="empty">見つからなかったよ🐈</div>';
}

function showDetail(id){
  currentId=id;
  const w=words.find(x=>x.id===id);
  if(!w){showPage("home");return;}
  document.getElementById("detailWord").textContent=w.word;
  document.getElementById("detailMeaning").textContent=w.meaning;
  document.getElementById("detailMistakes").textContent=w.mistakes;
  showPage("detail");
}

function mistake(){
  const w=words.find(x=>x.id===currentId);
  if(!w)return;
  w.mistakes++;
  save();
  document.getElementById("detailMistakes").textContent=w.mistakes;
}

function editWord(){
  const w=words.find(x=>x.id===currentId);
  if(!w)return;
  document.getElementById("editWordInput").value=w.word;
  document.getElementById("editMeaningInput").value=w.meaning;
  showPage("edit");
}

function saveEdit(){
  const w=words.find(x=>x.id===currentId);
  if(!w)return;
  const word=document.getElementById("editWordInput").value.trim();
  const meaning=document.getElementById("editMeaningInput").value.trim();
  if(!word || !meaning){alert("単語と意味・解説を入力してね！");return;}
  w.word=word;w.meaning=meaning;save();showDetail(currentId);
}

function deleteWord(){
  const w=words.find(x=>x.id===currentId);
  if(!w)return;
  if(confirm(`「${w.word}」を削除する？`)){
    words=words.filter(x=>x.id!==currentId);save();showPage("home");
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

document.getElementById("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchWord()});
renderHome();
</script>
</body>
</html>
